[project]
name = "formbench"
version = "0.1.0"
description = "Benchmark harness for extracting structured data from handwritten forms with vision-language models, with confidence flags for human review."
readme = "README.md"
authors = [
    { name = "Davis", email = "davistibz@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.25.1",
    "langfuse>=3.7.0",
    "openai>=2.48.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=11.3.0",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "zss>=1.2.0",
]

[project.scripts]
fetch-metadata = "formbench.dhis2:main"
register-template = "formbench.register_template:main"
register-run = "formbench.register_run:main"
register-approve = "formbench.register_payload:main"
register-synth = "formbench.register_synth:main"
register-bench = "formbench.register_bench:main"
register-eval = "formbench.register_eval:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100


[tool.ruff.lint]
ignore = ["E501"]
select = [
  "E", "F",   # errors and undefined names (ruff's defaults)
  "I",        # import sorting (I001)
  "SIM",      # simplifications (SIM115)
  "B",        # likely bugs, e.g. mutable default arguments
]
