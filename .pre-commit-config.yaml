repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1           # set to the latest release tag
    hooks:
      - id: gitleaks        # blocks commits containing secrets

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2           # MUST match `uv run ruff --version`
    hooks:
      - id: ruff            # lint: I001, SIM115 and the other selected rules
        args: [--fix]       # auto-fix what it safely can
      - id: ruff-format     # code formatting

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0             # set to the latest release tag
    hooks:
      - id: check-yaml          # catches broken YAML (CI and config files)
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files   # stops accidental commits of big images or model files
